name: cpp-arch

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.cpp-arch
      - .github/workflows/cpp-arch.yml
  schedule:
    # Понедельник, 01:00 UTC - это 04:00 по Москве.
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Дата снимка Arch Linux Archive (YYYY/MM/DD); пусто - сегодняшняя'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cpp-arch

jobs:
  build:
    name: Собрать и опубликовать cpp-arch
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Определить дату снимка
        id: snapshot
        run: |
          snapshot="${{ inputs.snapshot }}"
          [ -n "$snapshot" ] || snapshot=$(date -u +%Y/%m/%d)
          echo "date=$snapshot" >> "$GITHUB_OUTPUT"
          echo "tag=${snapshot//\//}"  >> "$GITHUB_OUTPUT"
          echo "Снимок Arch Linux Archive: $snapshot"

      - name: Определить версию Conan
        id: conan
        run: |
          version=$(curl -fsSL https://pypi.org/pypi/conan/json | jq -r '.info.version')
          case "$version" in
              [0-9]*.[0-9]*) ;;
              *) echo "PyPI вернул неожиданную версию Conan: '$version'" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Conan: $version"

      - uses: docker/setup-buildx-action@v3

      - name: Собрать образ
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cpp-arch
          build-args: |
            ARCH_SNAPSHOT=${{ steps.snapshot.outputs.date }}
            CONAN_VERSION=${{ steps.conan.outputs.version }}
          tags: cpp-arch:candidate
          load: true

      - name: Smoke - тулчейн, санитайзеры, conan
        run: |
          cat > "$RUNNER_TEMP/probe.cpp" <<'CPP'
          #include <algorithm>
          #include <print>
          #include <ranges>
          #include <vector>

          int main() {
              const auto even = std::views::iota(1, 10)
                              | std::views::filter([](int x) { return x % 2 == 0; })
                              | std::ranges::to<std::vector>();
              std::print("even: {}\n", even.size());
              return std::ranges::equal(even, std::vector{2, 4, 6, 8}) ? 0 : 1;
          }
          CPP

          probe() {
              docker run --rm --cap-add=SYS_PTRACE \
                  -v "$RUNNER_TEMP/probe.cpp:/tmp/probe.cpp:ro" \
                  cpp-arch:candidate bash -euo pipefail -c "$1"
          }

          probe 'cat /etc/cpp-arch-release'
          probe 'test "$(whoami)" = builder'
          probe 'conan --version && conan profile show -pr default'
          probe 'clang++ -std=c++23 -o /tmp/p /tmp/probe.cpp && /tmp/p'
          probe 'g++     -std=c++23 -o /tmp/p /tmp/probe.cpp && /tmp/p'
          probe 'clang++ -std=c++23 -fsanitize=address,undefined -fno-omit-frame-pointer -o /tmp/p /tmp/probe.cpp && /tmp/p'
          probe 'clang++ -std=c++23 -fsanitize=thread -o /tmp/p /tmp/probe.cpp && /tmp/p'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Опубликовать
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cpp-arch
          build-args: |
            ARCH_SNAPSHOT=${{ steps.snapshot.outputs.date }}
            CONAN_VERSION=${{ steps.conan.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.snapshot.outputs.tag }}
            ${{ env.IMAGE }}:latest
          push: true

      - name: Убрать осиротевшие версии
        uses: actions/delete-package-versions@v5
        with:
          package-name: cpp-arch
          package-type: container
          delete-only-untagged-versions: true

      - name: Оставить три последних версии
        uses: actions/delete-package-versions@v5
        with:
          package-name: cpp-arch
          package-type: container
          min-versions-to-keep: 3
