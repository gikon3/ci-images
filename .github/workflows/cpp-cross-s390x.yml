name: cpp-cross-s390x

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.cpp-cross-s390x
      - .github/workflows/cpp-cross-s390x.yml
  schedule:
    # Понедельник, 01:30 UTC - это 04:30 по Москве.
    - cron: '30 1 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cpp-cross-s390x

jobs:
  build:
    name: Собрать и опубликовать cpp-cross-s390x
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Определить версию Conan
        id: conan
        run: |
          version=$(curl -fsSL https://pypi.org/pypi/conan/json | jq -r '.info.version')
          case "$version" in
              [0-9]*.[0-9]*) ;;
              *) echo "PyPI вернул неожиданную версию Conan: '$version'" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "Conan: $version"

      - uses: docker/setup-buildx-action@v3

      - name: Собрать образ
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cpp-cross-s390x
          build-args: CONAN_VERSION=${{ steps.conan.outputs.version }}
          tags: cpp-cross-s390x:candidate
          load: true
          provenance: false
          sbom: false

      - name: Smoke - кросс-тулчейн, qemu, conan
        run: |
          cat > "$RUNNER_TEMP/probe.cpp" <<'CPP'
          #include <bit>
          #include <print>
          #include <ranges>
          #include <vector>

          int main() {
              const auto v = std::views::iota(1, 5) | std::ranges::to<std::vector>();
              const bool big = std::endian::native == std::endian::big;
              std::print("элементов {}, порядок байт: {}\n", v.size(), big ? "big" : "little");
              return (big && v.size() == 4) ? 0 : 1;
          }
          CPP

          probe() {
              docker run --rm -v "$RUNNER_TEMP/probe.cpp:/tmp/probe.cpp:ro" \
                  cpp-cross-s390x:candidate bash -euo pipefail -c "$1"
          }

          probe 'cat /etc/cpp-cross-s390x-release'
          probe 'test "$(whoami)" = builder'
          probe 'conan --version && conan profile show -pr:h s390x'
          probe 's390x-linux-gnu-g++ -std=c++23 -o /tmp/p /tmp/probe.cpp && qemu-s390x-static /tmp/p'
          # e_ident[EI_DATA] = 2 (MSB), e_machine = 0x0016 (EM_S390).
          probe 's390x-linux-gnu-g++ -std=c++23 -o /tmp/p /tmp/probe.cpp
                 test "$(od -An -tu1 -j5  -N1 /tmp/p | tr -d " ")" = 2
                 test "$(od -An -tx1 -j18 -N2 /tmp/p | tr -d " ")" = 0016'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Опубликовать
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cpp-cross-s390x
          build-args: CONAN_VERSION=${{ steps.conan.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.conan.outputs.tag }}
            ${{ env.IMAGE }}:latest
          push: true
          provenance: false
          sbom: false

      - name: Убрать осиротевшие версии
        uses: actions/delete-package-versions@v5
        with:
          package-name: cpp-cross-s390x
          package-type: container
          delete-only-untagged-versions: true

      - name: Оставить три последних версии
        uses: actions/delete-package-versions@v5
        with:
          package-name: cpp-cross-s390x
          package-type: container
          min-versions-to-keep: 3
